<!--
  ====================================================================
  PANDUAN PENGEMBANG (singkat)
  1. Semua isi aplikasi diatur oleh blok <script id="app-metadata"> di bawah.
     - Tambah/ubah field form  : ecosystems[].observation.fields / sampleTypes[].fields
     - Tambah jenis            : ecosystems[].species  (+ traits untuk kunci identifikasi)
     - Tambah aturan validasi  : ...rules  (jenis: compare, sumCompare, minRows, rowRule,
                                  requiredWhen, gpsPresent, gpsInBounds, gpsAccuracy,
                                  photoMin, notFuture)
     - Aktifkan modul baru     : ecosystems[].enabled = true (contoh: Terumbu karang)
     - Pola kode sampel        : sampleCode.pattern
  2. Naikkan app.metadataVersion setiap perubahan.
  3. Tanpa menerbitkan ulang: menu Data > Lihat/ubah metadata > Terbitkan ke semua
     perangkat (Editor/Owner). Perangkat menerima versi baru saat sinkron.
  4. Formula baru: tambahkan fungsi di objek COMPUTE, rujuk lewat "formula".
     Jenis aturan baru: tambahkan fungsi di objek RULES.
  5. Server lain (mis. server KKP): isi sync.restEndpoint dan sync.mode = "rest";
     kontrak API ada di objek Adapters.rest.
  ====================================================================
-->
<script type="application/json" id="app-metadata">
/*__META__*/
</script>
