<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2B2E">
<title>Blue Carbon Field App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BC Field">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F1; --surface:#FFFFFF; --sunk:#E4ECE9;
  --ink:#0F2B2E; --ink-2:#46605F; --ink-3:#7A8F8D; --line:#CFDBD7; --line-2:#B7C7C2;
  --lamun:#2E7D4F; --lamun-deep:#1C5A36; --lamun-tint:#E1EFE5;
  --mud:#7A5532; --mud-tint:#F0E6DA;
  --sea:#1D5F7A; --sea-tint:#DDEBF1;
  --tag:#FFD43B; --tag-deep:#C99A00; --tag-ink:#2A2100;
  --err:#B5302A; --err-tint:#FBE5E2; --warn:#8A5D00; --warn-tint:#FFF1CC; --ok:#2E7D4F;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --tap:48px;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand b{font-weight:700;font-stretch:88%;font-size:17px;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.1);font-size:13px;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:#7BD88F}
.net.off i{background:#FFB547}
.iconbtn{display:inline-grid;place-items:center;min-width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn .dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tag);color:var(--tag-ink);font-size:11px;font-weight:700;line-height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:1080px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:600}
.nav a[aria-current="page"]{color:var(--lamun-deep)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.nav a.scan{color:var(--ink)}
.nav a.scan span.ring{display:grid;place-items:center;width:46px;height:46px;margin-top:-18px;border-radius:14px;background:var(--tag);box-shadow:0 0 0 4px var(--surface)}
@media (min-width:900px){
  .nav{top:60px;bottom:0;right:auto;width:92px;grid-template-columns:1fr;grid-auto-rows:76px;align-content:start;border-top:0;border-right:1px solid var(--line);padding-top:12px}
  .nav a{height:76px}
  .nav a.scan span.ring{margin-top:0;box-shadow:none}
  main{padding:24px 32px 48px 124px;max-width:1180px}
}

/* ---------- type ---------- */
h1,h2,h3{margin:0;line-height:1.15;font-weight:700}
h1{font-size:28px;font-stretch:85%;letter-spacing:-.01em}
h2{font-size:20px;font-stretch:90%}
h3{font-size:16px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.code{font-weight:800;font-stretch:72%;letter-spacing:.01em}
p{margin:0 0 .6em}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.panel + .panel{margin-top:12px}
.section{margin-top:24px}
.section > h2{margin-bottom:10px}
.grid2{display:grid;gap:12px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* list rows: flat, divided — not cards */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:64px}
.item:first-child{border-top:0}
a.item:hover{background:#F6F9F8}
.item .main{flex:1;min-width:0}
.item .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eco-bar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* ---------- chips & badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.badge.err{background:var(--err-tint);color:var(--err)}
.badge.warn{background:var(--warn-tint);color:var(--warn)}
.badge.ok{background:var(--lamun-tint);color:var(--lamun-deep)}
.badge.pend{background:#FFF6D6;color:#6B5200}
.badge.eco-LM{background:var(--lamun-tint);color:var(--lamun-deep)}
.badge.eco-MG{background:var(--mud-tint);color:var(--mud)}
.badge.eco-TK{background:var(--sea-tint);color:var(--sea)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-align:left;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:1.5px solid var(--line-2);border-radius:99px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:550;user-select:none}
.chip[aria-pressed="true"],.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip input{position:absolute;opacity:0;pointer-events:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r-s);border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F3F7F6}
.btn.primary{background:var(--lamun-deep);border-color:var(--lamun-deep);color:#fff}
.btn.primary:hover{background:#174C2D}
.btn.dark{background:var(--ink);color:#fff}
.btn.tag{background:var(--tag);border-color:var(--tag-deep);color:var(--tag-ink)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- home ---------- */
.hello{display:grid;gap:16px;align-items:center}
@media(min-width:720px){.hello{grid-template-columns:1.2fr 1fr}}
.hello h1{font-size:34px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);padding:14px}
.stat b{display:block;font-size:30px;font-weight:750;font-stretch:80%;line-height:1}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.alert b{color:var(--err)}
.labbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:10px 0 8px}
.labbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- the specimen tag (signature element) ---------- */
.tagcard{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:18px 18px 16px 34px;background:var(--tag);color:var(--tag-ink);border-radius:6px 14px 14px 6px;box-shadow:0 1px 0 var(--tag-deep),0 10px 24px -14px rgba(60,45,0,.55)}
.tagcard::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--tag-deep)}
.tagcard::after{content:"";position:absolute;left:28px;top:10px;bottom:10px;border-left:2px dashed rgba(42,33,0,.28)}
.tagcard .id{font-size:clamp(26px,7.4vw,44px);font-weight:850;font-stretch:66%;line-height:.95;letter-spacing:.005em;word-break:break-all}
.tagcard .meta{margin-top:8px;font-size:14px;font-weight:550}
.tagcard .meta div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagcard .qr{width:118px;height:118px;padding:6px;background:#fff;border-radius:6px}
.tagcard .qr svg{display:block;width:100%;height:100%}
.tagcard.mini{padding:10px 12px 10px 26px;grid-template-columns:1fr;border-radius:4px 10px 10px 4px}
.tagcard.mini::before{left:8px;width:9px;height:9px;margin-top:-4.5px}
.tagcard.mini::after{left:20px}
.tagcard.mini .id{font-size:22px}
.hero-tag{transform:rotate(-1.6deg);transform-origin:20% 50%;max-width:420px;justify-self:center;width:100%}
@media (prefers-reduced-motion:no-preference){
  .hero-tag{animation:swing 1.1s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes swing{0%{transform:rotate(-9deg) translateY(-10px);opacity:0}100%{transform:rotate(-1.6deg);opacity:1}}
}

/* ---------- detail ---------- */
dl.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:0;margin:0}
dl.kv dt,dl.kv dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
dl.kv dt{color:var(--ink-2);font-size:14px;padding-right:10px}
dl.kv dd{font-weight:550;word-break:break-word}
dl.kv dt:first-of-type,dl.kv dd:first-of-type{border-top:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:6px 0;position:relative;color:var(--ink-3)}
.steps li::before{content:attr(data-n);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);font-size:12px;font-weight:700;background:var(--surface);z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12px;top:30px;bottom:-8px;border-left:2px solid var(--line)}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--lamun);border-color:var(--lamun);color:#fff}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{background:var(--tag);border-color:var(--tag-deep);color:var(--tag-ink)}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:10px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .chg{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.hist .chg s{color:var(--err);text-decoration-thickness:1px}
.hist .chg ins{color:var(--lamun-deep);text-decoration:none;font-weight:600}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issues li{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:var(--r-s);font-size:14px}
.issues li.error{background:var(--err-tint);color:#7A1F1A}
.issues li.warning{background:var(--warn-tint);color:#5E4000}
.issues li.ok{background:var(--lamun-tint);color:var(--lamun-deep)}
.carbon{display:flex;gap:18px;flex-wrap:wrap;padding:14px;border-radius:var(--r-m);background:var(--ink);color:#fff}
.carbon b{display:block;font-size:26px;font-stretch:80%;font-weight:750}
.carbon span{font-size:13px;opacity:.8}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;background:var(--sunk);border:0;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;text-align:left}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;margin-bottom:16px}
.field > label,.field > .lbl{font-weight:650;font-size:15px}
.field .req{color:var(--err);margin-left:2px}
.field .help{font-size:13px;color:var(--ink-2)}
.input{width:100%;min-height:var(--tap);padding:10px 12px;border:1.5px solid var(--line-2);border-radius:var(--r-s);background:var(--surface)}
.input:focus{border-color:var(--sea);outline:0;box-shadow:0 0 0 3px rgba(29,95,122,.18)}
textarea.input{min-height:88px;resize:vertical}
.unitwrap{display:flex;align-items:stretch}
.unitwrap .input{border-top-right-radius:0;border-bottom-right-radius:0}
.unitwrap .u{display:grid;place-items:center;padding:0 12px;border:1.5px solid var(--line-2);border-left:0;border-radius:0 var(--r-s) var(--r-s) 0;background:var(--sunk);color:var(--ink-2);font-size:14px;white-space:nowrap}
.field.bad .input{border-color:var(--err)}
.computed{padding:10px 12px;border-radius:var(--r-s);background:var(--sunk);font-weight:650}
.gpsbox{display:grid;gap:8px;padding:12px;border:1.5px dashed var(--line-2);border-radius:var(--r-s)}
.gpsbox .val{font-weight:700;font-size:17px}
.gpsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.rt-row{display:grid;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface);position:relative}
.rt-row:first-child{border-top:0}
.rt-row .n{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;color:var(--ink-3)}
.rt-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding-left:22px}
.rt-cells label{display:grid;gap:3px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.rt-cells .input{min-height:42px;padding:8px 10px}
.rt-del{justify-self:end}
.rt-foot{padding:8px;background:var(--sunk)}
.form-issues{margin-bottom:16px}

/* ---------- sheet / dialog ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,30,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:94vh;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;overflow:hidden}
@media(min-width:760px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:90vh}}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:18px}
.sheet .body{padding:18px;overflow:auto;flex:1}
.sheet footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px calc(12px + var(--safe-b));background:var(--surface);border-top:1px solid var(--line)}
.sheet footer .btn{flex:1}
@media(min-width:760px){.sheet footer .btn{flex:none}}
.sheet.small{max-width:440px}
.viewer img{width:100%;border-radius:var(--r-s);display:block}

.toasts{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:12px 14px;border-radius:var(--r-s);background:var(--ink);color:#fff;font-size:14.5px;box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.toast.err{background:var(--err)}
.toast.warn{background:#5E4000}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--warn-tint);color:#5E4000;font-size:14px;margin-bottom:14px}
.banner.info{background:var(--sea-tint);color:#123E50}

/* species */
.sp{padding:14px;border-top:1px solid var(--line)}
.sp:first-child{border-top:0}
.sp h3{font-style:italic;font-weight:650}
.sp ul{margin:6px 0 0;padding-left:18px;font-size:14.5px}
.sp .hab{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.glyph{width:34px;height:34px;flex:none}
.ai-out{display:grid;gap:10px}
.cand{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--lamun)}
.scanbox{display:grid;gap:12px;place-items:center;text-align:center;padding:28px 16px;border:2px dashed var(--line-2);border-radius:var(--r-l);background:var(--surface)}
.scanbox svg{color:var(--ink)}
pre.json{max-height:420px;overflow:auto;padding:12px;background:#0F2B2E;color:#D7EAE4;border-radius:var(--r-s);font-size:12.5px;line-height:1.5;white-space:pre}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:14px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:9px;font-weight:650;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{position:relative}
.search .input{padding-left:40px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
@media print{.top,.nav,.btn{display:none!important}}
.grid2 > *, .hello > *, .item .main, main > *{min-width:0}
html,body{overflow-x:hidden}

</style>
<!--
  ====================================================================
  PANDUAN PENGEMBANG (singkat)
  1. Semua isi aplikasi diatur oleh blok <script id="app-metadata"> di bawah.
     - Tambah/ubah field form  : ecosystems[].observation.fields / sampleTypes[].fields
     - Tambah jenis            : ecosystems[].species  (+ traits untuk kunci identifikasi)
     - Tambah aturan validasi  : ...rules  (jenis: compare, sumCompare, minRows, rowRule,
                                  requiredWhen, gpsPresent, gpsInBounds, gpsAccuracy,
                                  photoMin, notFuture)
     - Aktifkan modul baru     : ecosystems[].enabled = true (contoh: Terumbu karang)
     - Pola kode sampel        : sampleCode.pattern
  2. Naikkan app.metadataVersion setiap perubahan.
  3. Tanpa menerbitkan ulang: menu Data > Lihat/ubah metadata > Terbitkan ke semua
     perangkat (Editor/Owner). Perangkat menerima versi baru saat sinkron.
  4. Formula baru: tambahkan fungsi di objek COMPUTE, rujuk lewat "formula".
     Jenis aturan baru: tambahkan fungsi di objek RULES.
  5. Server lain (mis. server KKP): isi sync.restEndpoint dan sync.mode = "rest";
     kontrak API ada di objek Adapters.rest.
  ====================================================================
-->
<script type="application/json" id="app-metadata">
{
  "app": {
    "name": "Blue Carbon Field App",
    "shortName": "BC Field",

/* =====================================================================
   PENYIMPANAN LOKAL (IndexedDB, cadangan: memori)
   ===================================================================== */
const Store = {
  idb: null, mem: new Map(), persistent: false,
  async init() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('bcfa', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('records', { keyPath: 'id' }); d.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      const all = await this._req(this._os('records').getAll());
      (all || []).forEach(r => this.mem.set(r.id, r));
      this.persistent = true;
    } catch (e) { this.idb = null; this.persistent = false; }
  },
  _os(name, mode = 'readonly') { return this.idb.transaction(name, mode).objectStore(name); },
  _req(q) { return new Promise((res, rej) => { q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  all(type) { const a = [...this.mem.values()]; return type ? a.filter(r => r.type === type) : a; },
  get(id) { return this.mem.get(id); },
  async put(rec) {
    this.mem.set(rec.id, rec);
    if (this.idb) { try { await this._req(this._os('records', 'readwrite').put(rec)); } catch (e) { toast('Gagal menyimpan ke perangkat: ' + e.message, 'err'); } }
  },
  async del(id) {
    this.mem.delete(id);
    if (this.idb) { try { await this._req(this._os('records', 'readwrite').delete(id)); } catch (e) { } }
  },
  async kvGet(k) { if (!this.idb) return this['kv_' + k]; try { return await this._req(this._os('kv').get(k)); } catch (e) { return undefined; } },
  async kvSet(k, v) { if (!this.idb) { this['kv_' + k] = v; return; } try { await this._req(this._os('kv', 'readwrite').put(v, k)); } catch (e) { } }
};

    meta: {
      createdAt: at, createdBy: userName(), updatedAt: at, updatedBy: userName(),
      deviceId: Settings.v.deviceId, appVersion: META.app.version, metadataVersion: META.app.metadataVersion,
      rev: 1, syncStatus: 'pending', syncedAt: null, gps: null, hash: null, userAgent: navigator.userAgent.slice(0, 120)

}

}

  if (newData) {

    if (!Object.keys(changes).length && action !== 'dibuat') return rec;
    rec.data = newData;
    if (action !== 'dibuat') {
      rec.meta.rev += 1;
      rec.history.push({ rev: rec.meta.rev, at: nowISO(), by: userName(), device: Settings.v.deviceId, action, changes: trimChanges(changes) });
    }
  }
  rec.meta.updatedAt = nowISO(); rec.meta.updatedBy = userName();
  rec.meta.metadataVersion = META.app.metadataVersion; rec.meta.appVersion = META.app.version;
  rec.meta.syncStatus = 'pending';
  const g = rec.data.gps; rec.meta.gps = g && g.lat != null ? g : rec.meta.gps;

   Tambah formula baru di sini, lalu rujuk namanya dari metadata.
   ===================================================================== */

  compaction(d) { const p = num(d.penetrationDepth), r = num(d.recoveredLength); if (!p || r == null) return null; return { value: (1 - r / p) * 100, unit: '%', text: `${fmtNum((1 - r / p) * 100, 1)} %` }; },
  thickness(d) { const t = num(d.depthTop), b = num(d.depthBottom); if (t == null || b == null) return null; return { value: b - t, unit: 'cm', text: `${fmtNum(b - t, 1)} cm` }; },
  /* Stok karbon sedimen per interval: BD (g/cm³) × tebal (cm) × Corg (%) = Mg C/ha */
  soilCarbon(d) {
    const bd = num(d.bulkDensity), c = num(d.corgPercent), t = num(d.depthTop), b = num(d.depthBottom);

    const mgc = bd * (b - t) * c; return { value: mgc, unit: 'Mg C/ha', co2e: mgc * 44 / 12, text: `${fmtNum(mgc, 2)} Mg C/ha · ${fmtNum(mgc * 44 / 12, 2)} Mg CO₂e/ha` };

  sumCompare(r, d) {

  if (!m.app?.metadataVersion) errs.push('app.metadataVersion wajib ada.');
  if (!m.sampleCode?.pattern?.includes('{SEQ}')) errs.push('sampleCode.pattern harus memuat {SEQ}.');
  if (!Array.isArray(m.labStatus) || !m.labStatus.length) errs.push('labStatus wajib berisi daftar status.');
  if (!Array.isArray(m.ecosystems) || !m.ecosystems.length) errs.push('ecosystems wajib berisi daftar.');
  const checkFields = (fields, where) => (fields || []).forEach(f => {

/* ---------- toast & dialog ---------- */
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3400); }
function openSheet({ title, body, footer, small, onClose }) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${small ? 'small' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Tutup" style="color:var(--ink)">${I('close')}</button></header><div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}</div>`;
  document.body.appendChild(scrim); document.body.style.overflow = 'hidden';
  const close = (v) => { scrim.remove(); if (!$('.scrim')) document.body.style.overflow = ''; onClose && onClose(v); };
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(false); });
  scrim.addEventListener('keydown', e => { if (e.key === 'Escape') close(false); });
  setTimeout(() => { const f = scrim.querySelector('.body input, .body select, .body textarea, footer .btn'); f && f.focus({ preventScroll: true }); }, 30);
  return { el: scrim, close };
}
function confirmDialog(title, text, okLabel = 'Lanjutkan', danger = false) {
  return new Promise(res => {
    const s = openSheet({ title, small: true, body: `<p>${text}</p>`, footer: `<button class="btn" data-close>Batal</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button>`, onClose: v => res(!!v) });
    s.el.querySelector('[data-ok]').onclick = () => s.close(true);
  });
}

function fieldDefault(f) {
  if (f.default === 'today') return today();
  if (f.default === 'now') return localDT();
  if (f.default === 'user') return userName();
  if (f.default != null) return f.default;
  if (f.type === 'multiselect' || f.type === 'repeatTable') return [];

function inputHTML(f, v, ctx, name) {
  const nm = name || f.key; const id = 'f_' + nm.replace(/\W/g, '_');
  const common = `id="${id}" data-k="${esc(nm)}"`;
  switch (f.type) {
    case 'textarea': return `<textarea class="input" ${common} placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
    case 'select': case 'ecosystem': case 'species': case 'obsRef': {
      let opts;
      if (f.type === 'ecosystem') opts = ecoList().map(e => ({ value: e.code, label: e.label }));
      else if (f.type === 'species') opts = (ecoBy(ctx.eco)?.species || []).map(s => ({ value: s.name, label: s.name + (s.local ? ` – ${s.local}` : '') })).concat([{ value: 'Belum teridentifikasi', label: 'Belum teridentifikasi' }]);
      else if (f.type === 'obsRef') opts = live('observation').filter(o => o.parentId === ctx.surveyId).map(o => ({ value: o.id, label: obsTitle(o) }));
      else opts = fieldOptions(f);
      return `<select class="input" ${common}${ctx.lockEco && f.type === 'ecosystem' ? ' disabled' : ''}><option value="">— pilih —</option>${opts.map(o => `<option value="${esc(o.value)}"${String(o.value) === String(v) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    case 'multiselect': return `<div class="chips" role="group" aria-label="${esc(f.label)}">${fieldOptions(f).map(o => `<button type="button" class="chip" data-ms="${esc(nm)}" data-v="${esc(o.value)}" aria-pressed="${(v || []).includes(o.value)}">${esc(o.label)}</button>`).join('')}</div>`;
    case 'date': return `<input class="input" type="date" ${common} value="${esc(v)}">`;
    case 'datetime': return `<input class="input" type="datetime-local" ${common} value="${esc(v)}">`;
    case 'number': {
      const inp = `<input class="input" type="number" inputmode="decimal" ${common} value="${esc(v ?? '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} step="${f.step || 'any'}">`;

/* openForm: rec = record (baru atau lama), fields = daftar field metadata */
function openForm({ title, rec, fields, isNew, ctx, saveLabel = 'Simpan', onSaved }) {
  const draft = clone(rec.data);
  fields.forEach(f => { if (isNew && draft[f.key] === undefined && f.type !== 'computed' && f.type !== 'photos') draft[f.key] = fieldDefault(f); });
  ctx = Object.assign({ recId: rec.id, eco: draft.ecosystem, surveyId: rec.parentId }, ctx || {});
  const createdPhotos = [];
  const body = `<div class="form-issues" data-issues></div>${fields.map(f => fieldHTML(f, draft, ctx)).join('')}<p class="tiny">Tanda <span class="req">*</span> wajib diisi. Data tetap bisa disimpan walau belum lengkap; kekurangannya akan ditandai.</p>`;
  const sheet = openSheet({
    title, body, footer: `<button class="btn" data-close>Batal</button><button class="btn primary" data-save>${esc(saveLabel)}</button>`,
    onClose: async saved => { if (!saved && isNew) for (const id of createdPhotos) await Store.del(id); }
  });
  const root = sheet.el;
  const tmpRec = () => ({ ...rec, data: draft });
  const refresh = () => {
    $$('[data-computed]', root).forEach(el => { const f = fields.find(x => x.key === el.dataset.computed); const r = COMPUTE[f.formula]?.(draft); el.textContent = r ? r.text : 'Terhitung otomatis setelah data terisi'; });
    const fieldsSpec = specFor(tmpRec()); const keys = new Set(fields.map(f => f.key));
    const iss = validate(tmpRec()).filter(i => !i.field || keys.has(i.field));
    const c = countIssues(iss);
    $('[data-issues]', root).innerHTML = iss.length ? `<details ${c.e ? '' : ''}><summary class="small" style="cursor:pointer;font-weight:650">${c.e ? `<span class="badge err">${c.e} galat</span>` : ''} ${c.w ? `<span class="badge warn">${c.w} peringatan</span>` : ''} Lihat pemeriksaan data</summary><div style="margin-top:8px">${issuesHTML(iss)}</div></details>` : `<span class="badge ok">${I('check', 14, 2.4)} Pemeriksaan otomatis: lengkap</span>`;
    void fieldsSpec;
  };
  let t; const refreshSoon = () => { clearTimeout(t); t = setTimeout(refresh, 250); };
  const setPath = (path, val) => {
    const p = path.split('.');
    if (p.length === 3) { draft[p[0]][+p[1]][p[2]] = val; } else draft[path] = val;
  };
  const colOf = path => { const p = path.split('.'); const f = fields.find(x => x.key === p[0]); return p.length === 3 ? f.columns.find(c => c.key === p[2]) : f; };
  root.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.gpsm) {
      const k = el.dataset.k; const g = Object.assign({}, draft[k] || {});
      const v = el.value.trim().replace(',', '.');
      g[el.dataset.gpsm] = v === '' || isNaN(+v) ? null : +v; g.source = 'manual'; g.acc = null; g.at = nowISO();
      draft[k] = (g.lat == null && g.lon == null) ? null : g;
      const box = el.closest('.gpsbox'); const val = box.querySelector('.val'); val.textContent = draft[k]?.lat != null && draft[k]?.lon != null ? gpsText(draft[k]) : 'Belum lengkap';
      refreshSoon(); return;
    }
    if (!el.dataset.k || el.matches('select')) return;
    const f = colOf(el.dataset.k); let v = el.value;
    if (f?.uppercase) { v = v.toUpperCase(); if (el.value !== v) el.value = v; }
    if (f?.type === 'number') v = v === '' ? '' : (isNaN(+v) ? v : +v);
    setPath(el.dataset.k, v); refreshSoon();
  });
  root.addEventListener('change', e => {
    const el = e.target;
    if (el.matches('select[data-k]')) {
      setPath(el.dataset.k, el.value);
      const f = colOf(el.dataset.k);
      if (f?.type === 'obsRef' && el.value) { const o = Store.get(el.value); const gk = fields.find(x => x.type === 'gps')?.key; if (o && gk && !(draft[gk]?.lat != null) && o.data.gps?.lat != null) { draft[gk] = { ...o.data.gps, note: 'disalin dari observasi' }; const box = $(`[data-gps="${gk}"]`, root); box.outerHTML = gpsBoxHTML(fields.find(x => x.key === gk), draft[gk]); toast('Koordinat disalin dari ' + obsTitle(o)); } }
      if (f?.type === 'ecosystem') { ctx.eco = el.value; draft.ecosystem = el.value; }
      refreshSoon();
    }
    if (el.matches('[data-photo-in]')) {
      const cat = $('[data-photocat]', el.closest('[data-photos]')).value;
      const files = [...el.files]; el.value = '';
      (async () => {
        for (const file of files) { try { const p = await processPhoto(file, cat, rec.id, draft.gps); createdPhotos.push(p.id); } catch (err) { toast('Foto gagal diproses: ' + err.message, 'err'); } }
        $('[data-photolist]', root).innerHTML = photosHTML(rec.id, true); refresh();
      })();
    }
  });
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-act],[data-ms],[data-save]'); if (!b || !root.contains(b)) return;
    if (b.dataset.ms) { const arr = draft[b.dataset.ms] || []; const v = b.dataset.v; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); draft[b.dataset.ms] = arr; b.setAttribute('aria-pressed', i < 0); refreshSoon(); return; }
    if ('save' in b.dataset) {
      b.disabled = true;
      try { await saveRecord(rec, draft, isNew ? 'dibuat' : (ctx.action || 'diubah')); sheet.close(true); toast(isNew ? 'Tersimpan di perangkat' : 'Perubahan tersimpan'); onSaved && onSaved(rec); }
      catch (err) { b.disabled = false; toast('Gagal menyimpan: ' + err.message, 'err'); }
      return;
    }
    const act = b.dataset.act;
    if (act === 'rt-add') { const f = fields.find(x => x.key === b.dataset.k); const row = {}; f.columns.forEach(c => row[c.key] = fieldDefault(c)); (draft[f.key] = draft[f.key] || []).push(row); $(`[data-rt="${f.key}"]`, root).outerHTML = rtHTML(f, draft[f.key], ctx); const rows = $$(`[data-rt="${f.key}"] .rt-row`, root); rows[rows.length - 1]?.querySelector('select,input')?.focus(); refreshSoon(); }
    if (act === 'rt-del') { const f = fields.find(x => x.key === b.dataset.k); draft[f.key].splice(+b.dataset.i, 1); $(`[data-rt="${f.key}"]`, root).outerHTML = rtHTML(f, draft[f.key], ctx); refreshSoon(); }
    if (act === 'gps-get') {
      const k = b.dataset.k; b.disabled = true; b.innerHTML = `${I('pin', 18)} Mencari sinyal…`;
      try { draft[k] = await getGPS(); toast(`Koordinat diambil, akurasi ±${fmtNum(draft[k].acc, 0)} m`); }
      catch (err) { toast(err.message, 'warn'); }
      const box = $(`[data-gps="${k}"]`, root); box.outerHTML = gpsBoxHTML(fields.find(x => x.key === k), draft[k]); refreshSoon();
    }
    if (act === 'del-photo') { e.stopPropagation(); const p = Store.get(b.dataset.id); if (p && await confirmDialog('Hapus foto?', 'Foto ditandai terhapus dan tetap tercatat di riwayat.', 'Hapus foto', true)) { if (createdPhotos.includes(p.id)) await Store.del(p.id); else { p.meta.deleted = true; await saveRecord(p, null); } $('[data-photolist]', root).innerHTML = photosHTML(rec.id, true); refresh(); } }
    if (act === 'view-photo') viewPhoto(b.dataset.id);
  });
  refresh();
  return sheet;
}

/* ---------- GPS ---------- */
function getGPS() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Perangkat tidak menyediakan GPS. Isi koordinat manual.'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(7), lon: +p.coords.longitude.toFixed(7), acc: Math.round(p.coords.accuracy * 10) / 10, alt: p.coords.altitude, source: 'device', at: new Date(p.timestamp).toISOString() }),
      err => rej(new Error(err.code === 1 ? 'Akses lokasi ditolak di tampilan ini. Isi koordinat manual dari GPS genggam, atau buka aplikasi di browser langsung.' : 'Sinyal GPS belum didapat. Coba lagi di tempat terbuka atau isi manual.')),
      { enableHighAccuracy: true, timeout: META.gps.timeoutMs || 20000, maximumAge: 5000 });
  });
}

/* ---------- foto: kompres + metadata ---------- */
async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); URL.revokeObjectURL(u); }; im.onerror = () => rej(new Error('format gambar tidak didukung')); im.src = u; });
}
function encode(img, maxPx, q) {
  const w0 = img.width, h0 = img.height, s = Math.min(1, maxPx / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { url: c.toDataURL('image/jpeg', q), w: c.width, h: c.height };
}
async function processPhoto(file, category, parentId, gps) {
  const img = await loadBitmap(file);
  let q = META.sync.photoQuality, px = META.sync.photoMaxPx, out = encode(img, px, q);
  while (out.url.length > 200000 && q > 0.35) { q -= 0.08; out = encode(img, px, q); }
  while (out.url.length > 200000 && px > 500) { px -= 150; out = encode(img, px, q); }
  const thumb = encode(img, META.sync.thumbPx, 0.6).url;
  const rec = newRecord('photo', { category, caption: '', dataUrl: out.url, thumb, takenAt: new Date(file.lastModified || Date.now()).toISOString(), gps: gps && gps.lat != null ? gps : null, width: out.w, height: out.h, originalName: file.name, originalBytes: file.size, bytes: Math.round(out.url.length * 0.75) }, parentId);
  await saveRecord(rec, null);
  return rec;
}
function viewPhoto(id) {
  const p = Store.get(id); if (!p) return; const d = p.data;
  openSheet({ title: photoCatLabel(d.category), body: `<div class="viewer"><img src="${d.dataUrl}" alt="Foto ${esc(photoCatLabel(d.category))}"></div><dl class="kv" style="margin-top:12px"><dt>Waktu foto</dt><dd>${esc(fmtDT(d.takenAt))}</dd><dt>Koordinat</dt><dd>${esc(gpsText(d.gps))}</dd><dt>Diambil oleh</dt><dd>${esc(p.meta.createdBy)} · ${esc(p.meta.deviceId)}</dd><dt>Ukuran</dt><dd>${d.width}×${d.height} px · ${fmtNum(d.bytes / 1024, 0)} KB (asli ${fmtNum((d.originalBytes || 0) / 1024, 0)} KB)</dd><dt>Nama berkas asli</dt><dd>${esc(d.originalName || '–')}</dd><dt>Hash SHA-256</dt><dd class="mono" style="word-break:break-all">${esc(p.meta.hash || '–')}</dd><dt>Sinkron</dt><dd>${syncBadge(p)}</dd></dl>` });
}

/* =====================================================================
   SUPABASE: login tim + adapter sinkronisasi (PostgREST) + AI (Edge Function)
   Konfigurasi: metadata sync.supabaseUrl & sync.supabaseAnonKey,
   atau diisi dari menu Data > Server Supabase (disimpan di perangkat).
   ===================================================================== */
const Auth = {
  session: null,
  cfg() { return { url: (Settings.v.sbUrl || META.sync.supabaseUrl || '').trim().replace(/\/$/, ''), key: (Settings.v.sbKey || META.sync.supabaseAnonKey || '').trim() }; },
  configured() { const c = this.cfg(); return !!(c.url && c.key); },
  async load() { this.session = (await Store.kvGet('sb_session')) || null; },
  async _save(s) { this.session = s; await Store.kvSet('sb_session', s); },
  async _auth(path, body) {
    const c = this.cfg();
    const r = await fetch(`${c.url}/auth/v1/${path}`, { method: 'POST', headers: { apikey: c.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('HTTP ' + r.status));
    return j;
  },
  async signIn(email, password) {
    const j = await this._auth('token?grant_type=password', { email, password });
    await this._save({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Date.now() / 1000 + (j.expires_in || 3600)), user: { id: j.user?.id, email: j.user?.email } });
    if (!Settings.v.userName && j.user?.email) { Settings.v.userName = j.user.email; await Settings.save(); }
    Sync.reset();
  },
  async token() {
    if (!this.session) return null;
    if (this.session.expires_at * 1000 < Date.now() + 60000) {
      if (!navigator.onLine) return this.session.access_token;
      try { const j = await this._auth('token?grant_type=refresh_token', { refresh_token: this.session.refresh_token }); await this._save({ ...this.session, access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Date.now() / 1000 + (j.expires_in || 3600)) }); }
      catch (e) { await this._save(null); Sync.reset(); return null; }
    }
    return this.session.access_token;
  },
  async signOut() { try { const c = this.cfg(); await fetch(`${c.url}/auth/v1/logout`, { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + this.session?.access_token } }); } catch (e) { } await this._save(null); Sync.reset(); },
  async changePassword(pw) {
    const c = this.cfg(); const t = await this.token(); if (!t) throw new Error('Masuk dulu');
    const r = await fetch(`${c.url}/auth/v1/user`, { method: 'PUT', headers: { apikey: c.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status));
  },
  async isAdmin() { try { const rows = await sbFetch('/rest/v1/bcfa_admins?select=user_id'); return Array.isArray(rows) && rows.length > 0; } catch (e) { return false; } }
};
async function sbFetch(path, opt = {}) {
  const c = Auth.cfg(); const t = await Auth.token(); if (!t) { const e = new Error('Belum masuk ke akun tim'); e.code = 'auth'; throw e; }
  const r = await fetch(c.url + path, { ...opt, headers: { apikey: c.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opt.headers || {}) } });
  if (r.status === 401) { const e = new Error('Sesi berakhir, masuk ulang'); e.code = 'auth'; throw e; }
  if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error(j.message || j.hint || ('HTTP ' + r.status)); e.code = r.status === 403 || j.code === '42501' ? 'forbidden' : 'http'; throw e; }
  return r.status === 204 || r.status === 201 && !(r.headers.get('content-type') || '').includes('json') ? null : r.json().catch(() => null);
}
const inList = ids => '(' + ids.map(i => '"' + String(i).replace(/"/g, '') + '"').join(',') + ')';
const SupabaseAdapter = {
  get name() { return 'Supabase ' + (Auth.cfg().url.replace(/^https?:\/\//, '') || ''); },
  async connect() {
    if (!Auth.configured()) return null;
    if (!(await Auth.token())) { Sync.needLogin = true; return null; }
    Sync.needLogin = false;
    const since0 = Settings.v.sbPulledAt;
    const T = '/rest/v1/' + (META.sync.supabaseTable || 'bcfa_records');
    const row = rec => ({ id: rec.id, type: rec.type, parent_id: rec.parentId, sample_code: rec.data?.sampleCode || null, updated_at: rec.meta.updatedAt, deleted: !!rec.meta.deleted, doc: rec });
    const pageAll = async q => { const out = []; for (let off = 0; ; off += 1000) { const rows = await sbFetch(`${T}?${q}&select=doc&order=id&limit=1000&offset=${off}`); out.push(...(rows || []).map(r => r.doc)); if (!rows || rows.length < 1000) break; } return out; };
    return {
      async getOne(id) { const r = await sbFetch(`${T}?id=eq.${encodeURIComponent(id)}&select=doc`); return r && r[0] ? r[0].doc : null; },
      async put(rec) { await sbFetch(`${T}?on_conflict=id`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(row(rec)) }); },
      async pullMain() { const since = Settings.v.sbPulledAt; const q = 'type=in.(survey,observation,sample)' + (since ? `&synced_at=gt.${encodeURIComponent(since)}` : ''); const startedAt = new Date(Date.now() - 120000).toISOString(); const docs = await pageAll(q); Settings.v.sbPulledAt = startedAt; return docs; },
      async pullPhotos(parentIds) { if (since0) return pageAll(`type=eq.photo&synced_at=gt.${encodeURIComponent(since0)}`); const out = []; for (let i = 0; i < parentIds.length; i += 40) out.push(...await pageAll(`type=eq.photo&parent_id=in.${encodeURIComponent(inList(parentIds.slice(i, i + 40)))}`)); return out; },
      async getMeta() { const r = await sbFetch('/rest/v1/bcfa_config?key=eq.metadata&select=doc'); return r && r[0] ? r[0].doc : null; },
      async putMeta(doc) { await sbFetch('/rest/v1/bcfa_config?on_conflict=key', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ key: 'metadata', doc }) }); },
      async findCode(code) { const r = await sbFetch(`${T}?sample_code=eq.${encodeURIComponent(code)}&select=doc&limit=1`); return r && r[0] ? r[0].doc : null; }
    };
  }
};
/* AI lewat Supabase Edge Function (kunci API AI disimpan di server, bukan di aplikasi) */
async function aiViaSupabase(prompt, file) {
  const c = Auth.cfg(); const t = await Auth.token(); if (!t) throw Object.assign(new Error('Masuk ke akun tim dulu untuk memakai AI.'), { code: 'auth' });
  let imageBase64 = null; if (file) { const b = await blobFromFile(file); imageBase64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.readAsDataURL(b); }); }
  const r = await fetch(`${c.url}/functions/v1/${META.ai?.function || 'identify-species'}`, { method: 'POST', headers: { apikey: c.key, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, imageBase64, mediaType: 'image/jpeg' }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  if (!j.data) throw new Error('Jawaban AI tidak terbaca');
  return j.data;
}

/* Service worker: membuat aplikasi tetap terbuka tanpa internet (hanya di hosting sendiri) */
function registerSW() {
  if (!('serviceWorker' in navigator) || (location.protocol !== 'https:' && location.hostname !== 'localhost') || /claude\.ai|claudeusercontent/.test(location.hostname)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru aplikasi siap. Tutup lalu buka ulang aplikasi untuk memakainya.'); }); });
  }).catch(() => { });
}

    name: 'Server aplikasi (database artifact)',
    async connect() {
      const db = await cap('db'); if (!db) return null;
      const col = db.collection(META.sync.collection);
      return {
        async getOne(id) { const s = await col.doc(id).get(); return s.exists ? s.data() : null; },
        async put(rec) { await col.doc(rec.id).set(rec); },
        async pullMain() { const s = await col.where('type', 'in', ['survey', 'observation', 'sample']).get(); return s.docs.map(d => d.data()); },
        async pullPhotos(parentIds) { const out = []; for (let i = 0; i < parentIds.length; i += 30) { const s = await col.where('type', '==', 'photo').where('parentId', 'in', parentIds.slice(i, i + 30)).get(); out.push(...s.docs.map(d => d.data())); } return out; },
        async getMeta() { const s = await db.doc(META.sync.configDoc).get(); return s.exists ? s.data() : null; },
        async putMeta(doc) { await db.doc(META.sync.configDoc).set(doc); },
        async findCode(code) { const s = await col.where('type', '==', 'sample').where('data.sampleCode', '==', code).get().catch(() => null); if (s && s.docs.length) return s.docs[0].data(); const all = await col.where('type', '==', 'sample').get(); const d = all.docs.map(x => x.data()).find(r => r.data?.sampleCode === code); return d || null; }
      };
    }
  },
  rest: {
    get name() { return 'REST ' + META.sync.restEndpoint; },
    async connect() {
      const base = META.sync.restEndpoint; if (!base) return null;
      const j = async (path, opt) => { const r = await fetch(base.replace(/\/$/, '') + path, { headers: { 'Content-Type': 'application/json' }, ...opt }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.status === 204 ? null : r.json(); };
      return {
        getOne: id => j('/records/' + encodeURIComponent(id)).catch(() => null),
        put: rec => j('/records/' + encodeURIComponent(rec.id), { method: 'PUT', body: JSON.stringify(rec) }),
        pullMain: () => j('/records?type=survey,observation,sample'),
        pullPhotos: ids => j('/records?type=photo&parent=' + ids.join(',')),
        getMeta: () => j('/metadata').catch(() => null),
        putMeta: doc => j('/metadata', { method: 'PUT', body: JSON.stringify(doc) }),
        findCode: code => j('/samples/' + encodeURIComponent(code)).catch(() => null)
      };
    }
  }
};

const Sync = {
  conn: null, available: false, running: false, which: null, needLogin: false,
  reset() { this.conn = null; this.which = null; this.available = false; },
  async connect() {
    if (this.conn) return this.conn;
    const order = { rest: ['rest'], artifactDb: ['artifactDb'], supabase: ['supabase'] }[META.sync.mode] || ['supabase', 'rest', 'artifactDb'];
    for (const k of order) { try { const c = await Adapters[k].connect(); if (c) { this.conn = c; this.which = k; this.available = true; return c; } } catch (e) { } }
    this.available = false; return null;
  },
  adapterName() { return this.which ? Adapters[this.which].name : Auth.configured() ? SupabaseAdapter.name + (Auth.session ? '' : ' (belum masuk)') : (META.sync.restEndpoint ? Adapters.rest.name : 'belum terhubung — data tetap aman di perangkat'); },
  lastText() { const t = Settings.v.lastSync; return t ? `Sinkron terakhir ${fmtDT(t)}.` : 'Belum pernah disinkronkan.'; },
  async run({ silent = false } = {}) {
    if (this.running) return; if (!navigator.onLine) { if (!silent) toast('Sedang offline. Data tersimpan di perangkat dan akan dikirim saat ada sinyal.', 'warn'); return; }
    this.running = true; App.updateTop();
    try {
      const c = await this.connect();
      if (!c && this.needLogin) { if (!silent) toast('Masuk ke akun tim di menu Data agar data bisa dikirim ke server.', 'warn'); return; }
      if (!c) { if (!silent) toast('Server sinkronisasi belum terhubung di tampilan ini. Data aman di perangkat; gunakan Ekspor JSON untuk memindahkan data.', 'warn'); return; }
      let pushed = 0, pulled = 0, merged = 0;
      const pending = Store.all().filter(r => r.meta.syncStatus !== 'synced').sort((a, b) => (a.type === 'photo') - (b.type === 'photo'));
      for (const rec of pending) {
        const remote = await c.getOne(rec.id);
        let out = rec;
        if (remote && remote.meta && remote.meta.updatedAt > rec.meta.updatedAt && remote.meta.hash !== rec.meta.hash) { out = mergeRecords(rec, remote); merged++; }
        const at = nowISO(); const payload = clone(out); payload.meta.syncStatus = 'synced'; payload.meta.syncedAt = at;
        await c.put(payload); await Store.put(payload); pushed++;
      }
      const main = await c.pullMain();
      for (const r of main || []) {
        if (!r || !r.id) continue; const l = Store.get(r.id);
        if (!l || (l.meta.syncStatus === 'synced' && r.meta.updatedAt > l.meta.updatedAt)) { r.meta.syncStatus = 'synced'; await Store.put(r); pulled++; }
      }
      const parents = Store.all().filter(r => r.type !== 'photo').map(r => r.id);
      const have = new Set(Store.all('photo').map(p => p.id));
      if (parents.length) { const ph = await c.pullPhotos(parents); for (const p of ph || []) if (p && !have.has(p.id)) { p.meta.syncStatus = 'synced'; await Store.put(p); pulled++; } }
      await this.checkMeta(c, silent);
      Settings.v.lastSync = nowISO(); await Settings.save();
      if (!silent || pushed || pulled) toast(`Sinkron selesai: ${pushed} terkirim, ${pulled} diterima${merged ? `, ${merged} digabung` : ''}.`);
    } catch (e) {
      if (e && e.code === 'auth') this.reset();
      const m = e && e.code === 'auth' ? 'Sesi akun tim berakhir. Masuk ulang di menu Data.' : e && e.code === 'forbidden' ? 'Akun ini tidak punya izin menulis data. Hubungi admin.' : e && e.code === 'quota_exceeded' ? 'Kapasitas server penuh. Hubungi admin aplikasi.' : e && e.code === 'invalid_argument' ? 'Akun ini belum punya izin menulis ke server (minta akses Contributor).' : 'Sinkron terhenti: ' + (e.message || e.code || e);
      toast(m, 'err');
    } finally { this.running = false; App.onDataChanged(true); }
  },
  async checkMeta(c, silent) {
    try {
      const doc = await c.getMeta(); if (!doc || !doc.json) return;
      if (verCmp(doc.version, META.app.metadataVersion) <= 0) return;
      const m = JSON.parse(doc.json); const errs = validateMeta(m);
      if (errs.length) { if (!silent) toast('Metadata dari server diabaikan karena tidak valid.', 'warn'); return; }
      await applyMeta(m, 'server'); toast(`Metadata diperbarui ke versi ${m.app.metadataVersion}.`);
    } catch (e) { }
  },
  async lookup(code) { const c = await this.connect(); if (!c) return null; return c.findCode(code); }
};
function mergeRecords(local, remote) {
  const winner = clone(remote.meta.updatedAt >= local.meta.updatedAt ? remote : local);
  const loser = winner === remote ? local : remote;
  const seen = new Set(); const hist = [...(remote.history || []), ...(local.history || [])].filter(h => { const k = h.at + h.by + h.rev; if (seen.has(k)) return false; seen.add(k); return true; }).sort((a, b) => a.at.localeCompare(b.at));
  winner.history = hist; winner.meta.rev = Math.max(local.meta.rev, remote.meta.rev) + 1;
  winner.history.push({ rev: winner.meta.rev, at: nowISO(), by: userName(), device: Settings.v.deviceId, action: 'digabung saat sinkron', note: `Dua perangkat mengubah data ini. Versi ${loser.meta.updatedBy} (${fmtDT(loser.meta.updatedAt)}) digantikan versi yang lebih baru.`, changes: trimChanges(diffData(loser.data, winner.data)) });
  return winner;
}
async function applyMeta(m, source) { META = m; META_SOURCE = source; await Store.kvSet('meta', { json: JSON.stringify(m), source }); App.render(); }

async function blobFromFile(file, maxPx = 1100) {
  const img = await loadBitmap(file); const s = Math.min(1, maxPx / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

${images ? 'Foto terlampir.' : 'Tidak ada foto; gunakan catatan saja.'}

Balas HANYA JSON dengan bentuk:
{"candidates":[{"name":"nama ilmiah","confidence":0.0-1.0,"reasons":["ciri yang terlihat"]}],"checkNext":["ciri yang perlu dicek langsung di lapangan untuk memastikan"],"photoQuality":"baik|cukup|buruk","note":"catatan singkat"}

/* ---------- Pemindai QR ---------- */
let jsqrLoading = null;
function loadJsQR() { if (window.jsQR) return Promise.resolve(); return jsqrLoading ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = res; s.onerror = () => { jsqrLoading = null; rej(new Error('pemindai belum termuat')); }; document.head.appendChild(s); }); }
async function decodeQR(file) {
  const img = await loadBitmap(file);
  if ('BarcodeDetector' in window) { try { const det = new BarcodeDetector({ formats: ['qr_code'] }); const r = await det.detect(img); if (r && r[0]) return r[0].rawValue; } catch (e) { } }
  await loadJsQR();
  for (const px of [1000, 700, 1400, 500]) {
    const s = Math.min(1, px / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height); const code = window.jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    if (code && code.data) return code.data;
  }
  return null;
}
async function openSampleByCode(code) {
  code = (code || '').trim().toUpperCase(); if (!code) return;
  if (live('sample').find(s => s.data.sampleCode === code)) { go('sample-' + code); return; }
  if (navigator.onLine) { const r = await Sync.lookup(code).catch(() => null); if (r) { r.meta.syncStatus = 'synced'; await Store.put(r); go('sample-' + code); toast('Sampel diambil dari server'); return; } }
  go('sample-' + code);
}

async function deliver(filename, text, title) {
  const dl = await cap('downloads');
  if (dl) { try { await dl.save({ filename, data: text }); toast('Berkas disiapkan: ' + filename); return; } catch (e) { if (e?.code === 'cancelled' || e?.code === 'declined') return; } }
  const s = openSheet({ title: title || filename, body: `<p class="small">Unduhan tidak tersedia di tampilan ini. Salin isi berikut lalu simpan sebagai <b>${esc(filename)}</b>.</p><textarea class="input mono" style="min-height:300px" readonly>${esc(text.length > 400000 ? text.slice(0, 400000) + '\n…(terpotong, gunakan unduhan)' : text)}</textarea>`, footer: `<button class="btn" data-close>Tutup</button><button class="btn primary" data-copy>${I('copy', 18)} Salin</button>` });
  s.el.querySelector('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('Tersalin'); } catch (e) { s.el.querySelector('textarea').select(); toast('Tekan tahan lalu salin', 'warn'); } };
}

async function loadDemo() {
  const mk = async (type, data, parent) => { const r = newRecord(type, data, parent); r.meta.demo = true; await saveRecord(r, data, 'dibuat'); return r; };
  const photo = async (parent, cat, label, hue, gps) => { const p = await processPhoto(await demoImage(label, hue), cat, parent.id, gps); p.meta.demo = true; await Store.put(p); };
  const d0 = new Date(); d0.setDate(d0.getDate() - 3); const day = d0.toISOString().slice(0, 10);
  const at = (h, m) => `${day}T${pad(h, 2)}:${pad(m, 2)}`;
  const sv = await mk('survey', { title: 'Contoh – Survei lamun Teluk Kabola', ecosystem: 'LM', program: 'Inventarisasi baseline', province: 'Nusa Tenggara Timur', regency: 'Alor', siteName: 'Teluk Kabola (contoh)', siteCode: 'ALOR', startDate: day, endDate: '', teamLeader: userName(), teamMembers: 'Anggota tim A\nAnggota tim B', institution: 'Direktorat Konservasi Ekosistem – KKP', notes: 'Data contoh untuk mencoba aplikasi.' });
  const g1 = { lat: -8.2047, lon: 124.4891, acc: 4.2, source: 'device', at: new Date(at(8, 40)).toISOString() };
  const g2 = { lat: -8.2052, lon: 124.4903, acc: 21, source: 'device', at: new Date(at(9, 25)).toISOString() };
  const o1 = await mk('observation', { ecosystem: 'LM', stationCode: 'ST1', transect: 'T1', quadratPos: 10, quadratSize: '50 × 50 cm', observedAt: at(8, 40), gps: g1, waterDepth: 0.6, tide: 'Surut', substrate: 'Pasir berlumpur', totalCover: 65, speciesCover: [{ species: 'Enhalus acoroides', cover: 40, shoots: 18 }, { species: 'Thalassia hemprichii', cover: 25, shoots: 52 }], canopyHeight: 38, epiphyte: 'Sedikit', notes: '' }, sv.id);
  await photo(o1, 'plot', 'kuadran ST1-T1', 140, g1);
  const o2 = await mk('observation', { ecosystem: 'LM', stationCode: 'ST1', transect: 'T1', quadratPos: 20, quadratSize: '50 × 50 cm', observedAt: at(9, 25), gps: g2, waterDepth: 0.8, tide: 'Surut', substrate: 'Pasir', totalCover: 30, speciesCover: [{ species: 'Cymodocea rotundata', cover: 15, shoots: 70 }, { species: 'Halodule uninervis', cover: 6, shoots: 40 }], epiphyte: 'Tidak ada' }, sv.id);
  const core = (code, top, bot, extra) => ({ ecosystem: 'LM', sampleType: 'CORE', sampleCode: code, siteCode: 'ALOR', linkedObs: o1.id, collectedAt: at(10, 5), gps: g1, corerType: 'Pipa PVC', coreDiameter: 5, penetrationDepth: 52, recoveredLength: 46, depthTop: top, depthBottom: bot, sedimentType: 'Pasir berlumpur', treatment: ['Dilabel ganda (dalam & luar)', 'Kantong ziplock', 'Didinginkan 4 °C (cool box)', 'Dipotong per interval di lapangan'], storageTemp: 'Cool box ±4 °C', labStatus: 'FIELD', ...extra });
  const s1 = await mk('sample', core('LM-2026-ALOR-001', 0, 15, {}), sv.id);
  await photo(s1, 'sediment', 'core 0–15 cm', 30, g1);
  for (const [ch, act] of [[{ labStatus: 'TRANSIT' }, 'status lab diperbarui'], [{ labStatus: 'RECEIVED', labName: 'Laboratorium mitra (contoh)', labReceivedAt: day }, 'status lab diperbarui'], [{ labStatus: 'RESULT', corgMethod: 'Loss on Ignition (LOI)', bulkDensity: 0.92, corgPercent: 1.84, labAnalyst: 'Analis contoh' }, 'hasil lab diisi']]) await saveRecord(s1, { ...s1.data, ...ch }, act);
  const s2 = await mk('sample', core('LM-2026-ALOR-002', 15, 30, { labStatus: 'ANALYSIS', labName: 'Laboratorium mitra (contoh)' }), sv.id);
  await photo(s2, 'sediment', 'core 15–30 cm', 30, g1);
  await mk('sample', { ecosystem: 'LM', sampleType: 'BIO', sampleCode: 'LM-2026-ALOR-003', siteCode: 'ALOR', linkedObs: o1.id, collectedAt: at(10, 30), gps: g1, quadratArea: '0.0625', fraction: 'Atas substrat (daun)', species: 'Enhalus acoroides', wetWeight: 48.2, treatment: ['Kantong ziplock', 'Dibilas air tawar'], labStatus: 'TRANSIT' }, sv.id);
  const mv = await mk('survey', { title: 'Contoh – Plot mangrove pesisir', ecosystem: 'MG', program: 'Monitoring berkala', province: 'Jawa Tengah', regency: 'Demak', siteName: 'Pesisir contoh', siteCode: 'DMK', startDate: day, teamLeader: userName(), institution: 'Direktorat Konservasi Ekosistem – KKP' });
  const gm = { lat: -6.8711, lon: 110.5362, acc: 6, source: 'device', at: new Date(at(13, 10)).toISOString() };
  const p1 = await mk('observation', { ecosystem: 'MG', plotCode: 'P1', transect: 'T1', zone: 'Depan (laut)', plotSize: '10 × 10 m (pohon)', observedAt: at(13, 10), gps: gm, substrate: 'Lumpur', salinity: 28, canopyCover: 70, trees: [{ species: 'Avicennia marina', category: 'Pohon', dbh: 18.4, height: 9.5, condition: 'Hidup' }, { species: 'Rhizophora mucronata', category: 'Pohon', dbh: 8.2, height: 6, condition: 'Hidup' }, { species: 'Rhizophora mucronata', category: 'Pancang', dbh: 4.1, height: 2.6, condition: 'Hidup' }] }, mv.id);
  await photo(p1, 'plot', 'plot P1', 95, gm);
  await mk('sample', { ecosystem: 'MG', sampleType: 'CORE', sampleCode: 'MG-2026-DMK-001', siteCode: 'DMK', linkedObs: p1.id, collectedAt: at(13, 45), gps: gm, corerType: 'Russian peat corer', coreDiameter: 5.2, penetrationDepth: 100, recoveredLength: 94, depthTop: 0, depthBottom: 15, sedimentType: 'Lumpur', treatment: ['Dilabel ganda (dalam & luar)', 'Kantong ziplock'], labStatus: 'FIELD' }, mv.id);
  Store.all().forEach(r => { if (!r.meta.demo && (r.parentId && Store.get(r.parentId)?.meta.demo)) { r.meta.demo = true; Store.put(r); } });
  toast('Data contoh dimuat. Coba buka sampel LM-2026-ALOR-001.');
}

/* =====================================================================
   APP: router, top bar, aksi
   ===================================================================== */
function go(route) { if (location.hash.slice(1) === route) App.render(); else location.hash = route; }
const App = {
  state: { q: '', stab: 'obs', labf: '', spEco: null, spf: {} }, lastRoute: null, renderT: null, aiFile: null,
  route() { return decodeURIComponent(location.hash.slice(1)) || 'home'; },
  render() {
    const r = this.route();
    if (r !== this.lastRoute) { if (this.lastRoute && this.lastRoute.split('-')[0] !== r.split('-')[0]) { this.state.q = ''; this.aiFile = null; } if (!r.startsWith('survey-')) this.state.stab = this.state.stab; }
    let html;
    if (r.startsWith('survey-')) html = V.survey(r.slice(7));
    else if (r.startsWith('obs-')) html = V.obs(r.slice(4));
    else if (r.startsWith('sample-')) html = V.sample(r.slice(7).toUpperCase());
    else html = (V[r] || V.home)();
    const view = $('#view'); view.innerHTML = html;
    const sec = r.startsWith('survey') ? 'surveys' : r.startsWith('obs') ? 'surveys' : r.startsWith('sample') ? 'samples' : (V[r] ? r : 'home');
    $$('.nav a').forEach(a => a.dataset.sec === sec ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    if (r !== this.lastRoute) { window.scrollTo(0, 0); const h = view.querySelector('h1'); if (h) { h.tabIndex = -1; } }
    document.title = `${META.app.name}`;
    this.lastRoute = r; this.updateTop();
    if (r === 'home' && location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
  },
  updateTop() {
    const pending = Store.all().filter(x => x.meta.syncStatus !== 'synced').length;
    const net = $('#net'); net.classList.toggle('off', !navigator.onLine); net.querySelector('span').textContent = navigator.onLine ? 'Online' : 'Offline';
    const sb = $('#syncBtn'); sb.classList.toggle('spin', Sync.running); sb.querySelector('.dot').hidden = !pending; sb.querySelector('.dot').textContent = pending > 99 ? '99+' : pending;
    sb.setAttribute('aria-label', `Sinkronkan, ${pending} data belum terkirim`);
  },
  onDataChanged(now) { this.updateTop(); clearTimeout(this.renderT); this.renderT = setTimeout(() => this.render(), now ? 0 : 120); }
};

const ACTIONS = {
  'sb-save': async () => { Settings.v.sbUrl = $('#sbUrl').value.trim(); Settings.v.sbKey = $('#sbKey').value.trim(); await Settings.save(); Sync.reset(); toast(Auth.configured() ? 'Server Supabase disimpan. Silakan masuk.' : 'Server dikosongkan'); App.render(); },
  'sb-login': async b => { const em = $('#sbEmail').value.trim(), pw = $('#sbPw').value; if (!em || !pw) { toast('Isi email dan kata sandi.', 'warn'); return; } b.disabled = true; try { await Auth.signIn(em, pw); toast('Masuk sebagai ' + em); App.render(); Sync.run({ silent: true }); } catch (e) { b.disabled = false; toast('Gagal masuk: ' + e.message, 'err'); } },
  'sb-chpw': async b => { const a = $('#sbNewPw').value, c = $('#sbNewPw2').value; if (a.length < 8) { toast('Kata sandi minimal 8 karakter.', 'warn'); return; } if (a !== c) { toast('Kedua kata sandi tidak sama.', 'warn'); return; } b.disabled = true; try { await Auth.changePassword(a); toast('Kata sandi baru tersimpan. Pakai ini untuk masuk berikutnya.'); App.render(); } catch (e) { b.disabled = false; toast('Gagal mengubah kata sandi: ' + e.message, 'err'); } },
  'sb-showpw': () => { const i = $('#sbPw'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; },
  'sb-logout': async () => { const p = Store.all().filter(r => r.meta.syncStatus !== 'synced').length; if (p && !await confirmDialog('Keluar dari akun tim?', `${p} data belum terkirim. Data tetap aman di perangkat dan dikirim setelah masuk lagi.`, 'Keluar')) return; await Auth.signOut(); toast('Sudah keluar'); App.render(); },
  'new-survey': () => { const rec = newRecord('survey', {}, null); openForm({ title: 'Survei baru', rec, fields: META.surveyForm.fields, isNew: true, saveLabel: 'Buat survei', onSaved: r => go('survey-' + r.id) }); },
  'edit-survey': b => { const rec = Store.get(b.dataset.id); const kids = live('observation').concat(live('sample')).some(x => x.parentId === rec.id); openForm({ title: 'Ubah survei', rec, fields: META.surveyForm.fields, ctx: { lockEco: kids } }); },
  'new-obs': b => { const s = Store.get(b.dataset.id); const eco = ecoBy(s.data.ecosystem); const rec = newRecord('observation', { ecosystem: s.data.ecosystem }, s.id); openForm({ title: `${eco.observation.label} baru`, rec, fields: eco.observation.fields, isNew: true, onSaved: r => go('obs-' + r.id) }); },
  'edit-obs': b => { const rec = Store.get(b.dataset.id); openForm({ title: `Ubah ${ecoBy(rec.data.ecosystem).observation.label.toLowerCase()}`, rec, fields: ecoBy(rec.data.ecosystem).observation.fields }); },
  'new-sample': b => {
    const s = Store.get(b.dataset.id); const eco = ecoBy(s.data.ecosystem); const st = eco.sampleTypes.find(x => x.code === b.dataset.st);
    if (!s.data.siteCode) { toast('Isi kode lokasi survei terlebih dahulu.', 'warn'); return; }
    const code = nextSampleCode(eco.code, s.data.siteCode, (s.data.startDate || today()).slice(0, 4), st.code);
    const o = b.dataset.obs ? Store.get(b.dataset.obs) : null;
    const rec = newRecord('sample', { ecosystem: eco.code, sampleType: st.code, sampleCode: code, siteCode: s.data.siteCode, labStatus: 'FIELD', linkedObs: o ? o.id : '', gps: o?.data.gps?.lat != null ? { ...o.data.gps, note: 'disalin dari observasi' } : null }, s.id);
    openForm({ title: `${st.label} · ${code}`, rec, fields: st.fields, isNew: true, saveLabel: 'Simpan & buat label', onSaved: r => go('sample-' + r.data.sampleCode) });
  },
  'edit-sample': b => { const rec = Store.get(b.dataset.id); openForm({ title: `Data lapangan · ${rec.data.sampleCode}`, rec, fields: sampleTypeOf(rec).fields }); },
  'edit-lab': b => { const rec = Store.get(b.dataset.id); openForm({ title: `Laboratorium · ${rec.data.sampleCode}`, rec, fields: sampleTypeOf(rec).labFields || [], ctx: { action: 'status/hasil lab diperbarui' } }); },
  delete: async b => {
    const rec = Store.get(b.dataset.id);
    if (rec.type === 'survey' && live('observation').concat(live('sample')).some(x => x.parentId === rec.id)) { toast('Hapus dulu plot dan sampel di dalam survei ini.', 'warn'); return; }
    if (!await confirmDialog('Hapus data ini?', 'Data ditandai terhapus dan disinkronkan, sehingga jejaknya tetap tercatat untuk audit MRV.', 'Hapus', true)) return;
    rec.meta.deleted = true; rec.meta.rev += 1; rec.history.push({ rev: rec.meta.rev, at: nowISO(), by: userName(), device: Settings.v.deviceId, action: 'dihapus' });
    await saveRecord(rec, null); toast('Data dihapus');
    go(rec.type === 'survey' ? 'surveys' : rec.type === 'sample' ? 'survey-' + rec.parentId : 'survey-' + rec.parentId);
  },
  stab: b => { App.state.stab = b.dataset.v; App.render(); },
  labf: b => { App.state.labf = b.dataset.v; App.render(); },
  spEco: b => { App.state.spEco = b.dataset.v; App.render(); },
  spf: b => { const ek = App.state.spEco || ecoList().find(e => e.species?.length).code; const f = App.state.spf[ek] ||= {}; f[b.dataset.t] = f[b.dataset.t] === b.dataset.v ? '' : b.dataset.v; App.render(); },
  'spf-reset': () => { const ek = App.state.spEco || ecoList().find(e => e.species?.length).code; App.state.spf[ek] = {}; App.render(); },
  'ai-id': b => aiIdentify(b.dataset.eco, App.aiFile, ($('[data-ai-notes]') || {}).value || '', $('[data-ai-out]')),
  sync: () => Sync.run(),
  'export-json': exportJSON, 'export-csv': exportCSV, 'export-mrv': exportMRV,
  label: b => { const x = Store.get(b.dataset.id); deliver(`label-${x.data.sampleCode}.svg`, labelSVG(x), 'Label sampel (SVG)'); },
  'view-photo': b => viewPhoto(b.dataset.id),
  'remote-lookup': async b => { b.disabled = true; await openSampleByCode(b.dataset.v); },
  demo: async b => { if (b) b.disabled = true; await loadDemo(); go('home'); },
  'demo-clear': async () => { if (!await confirmDialog('Hapus data contoh?', 'Hanya data yang ditandai contoh yang dihapus dari perangkat ini.', 'Hapus data contoh', true)) return; for (const r of Store.all().filter(r => r.meta.demo)) await Store.del(r.id); App.onDataChanged(true); toast('Data contoh dihapus'); },
  wipe: async () => { const p = Store.all().filter(r => r.meta.syncStatus !== 'synced' && !r.meta.demo).length; if (!await confirmDialog('Hapus semua data di perangkat?', p ? `<b>${p} data belum terkirim ke server</b> dan akan hilang permanen. Ekspor cadangan JSON dulu bila ragu.` : 'Data yang sudah tersinkron tetap ada di server.', 'Hapus semua', true)) return; for (const r of Store.all()) await Store.del(r.id); App.onDataChanged(true); toast('Perangkat dikosongkan'); },
  'meta-reset': async () => { await Store.kvSet('meta', null); META = EMBEDDED_META; META_SOURCE = 'tertanam'; App.render(); toast('Memakai metadata tertanam'); },
  'meta-edit': async () => {
    let canPublish = false; if (Auth.configured() && Auth.session) canPublish = await Auth.isAdmin(); else { const user = await cap('user'); canPublish = !!(user && (user.canEdit ? await user.canEdit() : false)); }
    const s = openSheet({ title: 'Metadata aplikasi', body: `<p class="small">Ubah form, daftar jenis, aturan validasi, status lab, atau pola kode. Naikkan <span class="mono">app.metadataVersion</span> setiap perubahan agar perangkat lain menerimanya.</p><textarea class="input mono" data-meta style="min-height:52vh;font-size:12.5px" spellcheck="false">${esc(JSON.stringify(META, null, 2))}</textarea><div data-meta-out style="margin-top:10px"></div>`, footer: `<button class="btn" data-check>Periksa</button><button class="btn" data-apply>Terapkan di perangkat ini</button><button class="btn primary" data-publish ${canPublish ? '' : 'disabled title="Hanya admin"'}>Terbitkan ke semua perangkat</button>` });
    const read = () => { const out = $('[data-meta-out]', s.el); try { const m = JSON.parse($('[data-meta]', s.el).value); const errs = validateMeta(m); out.innerHTML = errs.length ? issuesHTML(errs.map(e => ({ level: 'error', msg: e }))) : issuesHTML([], `Metadata valid · versi ${m.app.metadataVersion}`); return errs.length ? null : m; } catch (e) { out.innerHTML = issuesHTML([{ level: 'error', msg: 'JSON tidak valid: ' + e.message }]); return null; } };
    $('[data-check]', s.el).onclick = read;
    $('[data-apply]', s.el).onclick = async () => { const m = read(); if (m) { await applyMeta(m, 'lokal'); s.close(true); toast('Metadata diterapkan di perangkat ini'); } };
    $('[data-publish]', s.el).onclick = async () => { const m = read(); if (!m) return; if (verCmp(m.app.metadataVersion, META.app.metadataVersion) <= 0 && JSON.stringify(m) !== JSON.stringify(META)) { $('[data-meta-out]', s.el).innerHTML = issuesHTML([{ level: 'error', msg: 'Naikkan app.metadataVersion sebelum menerbitkan.' }]); return; } const c = await Sync.connect(); if (!c) { toast('Server tidak tersedia.', 'err'); return; } try { await c.putMeta({ json: JSON.stringify(m), version: m.app.metadataVersion, updatedAt: nowISO(), by: userName() }); await applyMeta(m, 'server'); s.close(true); toast(`Metadata ${m.app.metadataVersion} diterbitkan`); } catch (e) { toast('Gagal menerbitkan: ' + (e.message || e.code), 'err'); } };
  }
};

document.addEventListener('click', e => {
  if (e.target.closest('.scrim')) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (fn) { if (b.type !== 'checkbox') e.preventDefault(); fn(b, e); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ph[role=button]') && !e.target.closest('.scrim')) { e.preventDefault(); viewPhoto(e.target.dataset.id); } });
document.addEventListener('input', e => {
  const el = e.target; if (el.closest('.scrim')) return;
  if (el.matches('[data-search]')) { App.state.q = el.value; const pos = el.selectionStart; App.render(); const n = $('[data-search]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } }
  if (el.matches('[data-setting]')) { Settings.v[el.dataset.setting] = el.value; clearTimeout(App._st); App._st = setTimeout(() => Settings.save(), 400); }
});
document.addEventListener('change', async e => {
  const el = e.target; if (el.closest('.scrim')) return;
  if (el.matches('[data-scan-in]')) {
    const f = el.files[0]; el.value = ''; if (!f) return; const out = $('[data-scan-out]'); out.innerHTML = '<p class="small">Membaca QR…</p>';
    try { const txt = await decodeQR(f); const code = parseQr(txt); if (code) { out.innerHTML = `<p class="small">Terbaca: <b class="code">${esc(code)}</b></p>`; openSampleByCode(code); } else out.innerHTML = issuesHTML([{ level: 'warning', msg: txt ? `QR terbaca (“${txt.slice(0, 60)}”) tetapi bukan label sampel aplikasi ini.` : 'QR tidak terbaca. Ambil foto lebih dekat, terang, dan tidak buram, atau ketik kode.' }]); }
    catch (err) { out.innerHTML = issuesHTML([{ level: 'warning', msg: 'Pemindai belum termuat (butuh internet sekali). Ketik kode sampel di bawah.' }]); }
  }
  if (el.matches('[data-ai-in]')) { App.aiFile = el.files[0] || null; el.value = ''; const l = $('[data-ai-file]'); if (l) l.textContent = App.aiFile ? `Foto: ${App.aiFile.name || 'kamera'}` : 'Belum ada foto'; }
  if (el.matches('[data-import]')) { const f = el.files[0]; el.value = ''; if (f) importJSON(f); }
});
document.addEventListener('submit', e => { if (e.target.matches('[data-manual]')) { e.preventDefault(); const v = $('#manualCode').value; const code = parseQr(v) || v.trim().toUpperCase(); openSampleByCode(code); } });
window.addEventListener('hashchange', () => App.render());
window.addEventListener('online', () => { App.updateTop(); toast('Kembali online'); if (Store.all().some(r => r.meta.syncStatus !== 'synced')) Sync.run({ silent: true }); loadJsQR().catch(() => { }); });
window.addEventListener('offline', () => { App.updateTop(); toast('Offline. Data tetap tersimpan di perangkat.', 'warn'); });

(async function boot() {
  $$('[data-ic]').forEach(el => { el.outerHTML = el.dataset.ic === 'mark' ? MARK : I(el.dataset.ic, el.dataset.ic === 'scan' ? 26 : 24); });
  await Store.init(); await Settings.load(); await Auth.load(); registerSW();
  try { const c = await Store.kvGet('meta'); if (c && c.json) { const m = JSON.parse(c.json); if (!validateMeta(m).length && verCmp(m.app.metadataVersion, EMBEDDED_META.app.metadataVersion) >= 0) { META = m; META_SOURCE = c.source || 'lokal'; } } } catch (e) { }
  App.render();
  setTimeout(() => { if (navigator.onLine) { loadJsQR().catch(() => { }); Sync.run({ silent: true }); } }, 1500);
})();
